name: Publish image

# Builds and publishes both variants to GHCR (GitHub's package registry), which is
# where "hosted on GitHub" ends for a long-running server: Actions has no runtime,
# so the panel ships as an image you can run on any Docker host.
#
#   ghcr.io/<owner>/skvm:latest          unprivileged, simulated fleet or node agents
#   ghcr.io/<owner>/skvm:docker          + docker CLI, talks to a mounted daemon
#
# Only releases are published: every v* tag, plus a manual run from the Actions
# tab. An ordinary push to main runs the tests and nothing else - the repository is
# public, so images appear on ghcr.io only when someone asks for them. `latest`
# follows the newest tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish (defaults to the branch/tag that triggered)
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.variant }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || '' }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          base="ghcr.io/${repo}"
          prefix=""
          if [ "${{ matrix.variant }}" = "docker" ]; then prefix="docker-"; fi
          short="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          tags="${base}:${prefix}latest,${base}:${prefix}${short}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
            tags="${tags},${base}:${prefix}${ver}"
            tags="${tags},${base}:${prefix}$(printf '%s' "$ver" | cut -d. -f1,2)"
            tags="${tags},${base}:${prefix}$(printf '%s' "$ver" | cut -d. -f1)"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publishing:"
          printf '%s\n' "$tags" | tr ',' '\n'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VARIANT=${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max
          sbom: true
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Pull and boot the published image
        if: matrix.variant == 'slim'
        run: |
          set -uo pipefail
          image="$(printf '%s' "${{ steps.tags.outputs.tags }}" | cut -d, -f1)"
          docker pull "$image"
          docker run -d --name published -p 8080:8080 -e SKVM_ADMIN_PASSWORD=publish-check "$image"
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8080/version
              exit 0
            fi
            sleep 3
          done
          echo "--- logs ---"
          docker logs published
          exit 1
