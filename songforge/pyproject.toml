[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "songforge"
version = "0.1.0"
description = "Give it a vocal; get the whole song back. Vocal-conditioned music generation + mixing pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# audio format support (mp3/flac/ogg, 24-bit files) and better resampling
io = ["soundfile>=0.12"]
# neural backends
musicgen = ["torch>=2.1", "torchaudio>=2.1", "audiocraft>=1.3"]
# stem separation
separate = ["demucs>=4.0"]
# training/exports (see train/)
train = ["torch>=2.1", "soundfile>=0.12"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
songforge = "songforge.cli:main"

[tool.setuptools]
packages = ["songforge"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
